# Workflow inspiration and adaptation came from Andruino-Cli
# https://github.com/arduino/arduino-cli/blob/master/.github/workflows/deploy-cobra-mkdocs-versioned-poetry.yml

name: Deploy Documents 6.0

on:
  push:
    branches:
      # Branch to base "dev" website on.
      - master
      # Release branches have names like 0.8.x, 0.9.x, ...
      - "[0-9]+.[0-9]+.x"
  create:

jobs:
  pre-publish:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.determination.outputs.result }}
    steps:
      - name: Determine if documentation should be published on this workflow run
        id: determination
        run: |
          RELEASE_BRANCH_REGEX="refs/heads/[0-9]+.[0-9]+.x"
          if [[ "${{ github.event_name }}" == "push" || ( "${{ github.event_name }}" == "create" && "${{ github.ref }}" =~ $RELEASE_BRANCH_REGEX ) ]]; then
            RESULT="true"
          else
            RESULT="false"
          fi

          echo "result=$RESULT" >> $GITHUB_OUTPUT
          echo "Deploy documents: $RESULT"

  publish:
    runs-on: ubuntu-latest
    needs: pre-publish
    if: needs.pre-publish.outputs.result == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build documentation image
        run: docker build -t phalcon-docs resources/docker

      - name: Get sponsors and fanart
        run: |
          wget -O docs/assets/sponsors.md \
            https://raw.githubusercontent.com/phalcon/assets/master/phalcon/sponsors-fragment.html
          wget -O overrides/fanart.md \
            https://raw.githubusercontent.com/phalcon/assets/master/phalcon/fanart-fragment.html

      # NFR list update disabled for now (not essential).
      # - name: Update NFR list
      #   run: |
      #     docker run --rm -v "$PWD":/docs --entrypoint python phalcon-docs update-nfr.py

      - name: Determine versioning parameters
        id: determine-versioning
        run: |
          # Read the first line from the VERSION file
          LINE=$(head -n 1 ./VERSION)

          # Extract version and alias using parameter expansion
          VERSION="${LINE%%|*}"
          ALIAS="${LINE#*|}"

          # Trim stray whitespace / CRLF so the alias gate matches exactly
          VERSION=$(printf '%s' "$VERSION" | tr -d '[:space:]')
          ALIAS=$(printf '%s' "$ALIAS" | tr -d '[:space:]')

          # Print the extracted values for verification
          echo "Version: $VERSION"
          echo "Alias: $ALIAS"

          echo "PH_DOCS_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PH_DOCS_ALIAS=$ALIAS" >> $GITHUB_ENV

      - name: Deploy
        if: ${{ env.PH_DOCS_VERSION != '' }}
        run: |
          # Publishing implies creating a git commit on the production branch,
          # We will need to create a user for this at some point
          echo "Deploying with Mike"
          git config user.name niden
          git config user.email nikos@niden.net
          git fetch --no-tags --prune --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          # Build and commit inside the container; push from the runner.
          # checkout@v6 keeps its credentials outside the workspace, so they
          # are not visible inside the container.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/docs -v "$PWD":/docs \
            --entrypoint mike phalcon-docs deploy ${{ env.PH_DOCS_VERSION }}
          git push origin gh-pages
          echo "Deployed"

      - name: Point Cloudflare /latest at this version
        if: ${{ env.PH_DOCS_ALIAS == 'latest' }}
        env:
          CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID:    ${{ secrets.CF_ZONE_ID }}
          CF_RULESET_ID: ${{ secrets.CF_RULESET_ID }}
          CF_RULE_ID:    ${{ secrets.CF_RULE_ID }}
        run: |
          echo "Pointing /latest -> /${PH_DOCS_VERSION} at Cloudflare"
          curl -sS --fail-with-body -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/rulesets/${CF_RULESET_ID}/rules/${CF_RULE_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @- <<JSON
          {
            "action": "redirect",
            "description": "Documentation Latest",
            "enabled": true,
            "expression": "(http.request.full_uri wildcard r\"https://docs.phalcon.io/latest/*\")",
            "action_parameters": {
              "from_value": {
                "status_code": 301,
                "target_url": {
                  "expression": "wildcard_replace(http.request.full_uri, r\"https://docs.phalcon.io/latest/*\", r\"https://docs.phalcon.io/${PH_DOCS_VERSION}/\${1}\")"
                },
                "preserve_query_string": true
              }
            }
          }
          JSON

